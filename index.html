<style>
:root{
  --red:#DC143C; --red-text:#C8102E; --red-dark:#9E0C24; --red-soft:#FDECEF;
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#3A3A3C; --muted:#636366; --line:#E5E5EA;
  --green:#248A3D; --green-text:#1C5E2C; --green-soft:#EAF7EE; --amber:#8A4B00; --amber-soft:#FFF3E0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 100px) 20px}
h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:-0.02em}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red-text)}
.over{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:20px}
.stack{display:flex;flex-direction:column}
.gap6{gap:6px}.gap10{gap:10px}.gap14{gap:14px}.gap18{gap:18px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.sl{background:var(--amber-soft);color:var(--amber)}
.big{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-0.02em;margin:0}
.de{font-size:21px;font-weight:600;margin:0}
.say{font-size:16px;color:var(--muted);margin:0}
.say b{color:var(--ink);font-weight:600}
.btn{height:54px;border-radius:16px;border:none;background:var(--red);color:#fff;font-size:17px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--red-text)}
.btn.outline{background:#fff;color:var(--red-text);border:1.5px solid var(--red)}
.btn.green{background:var(--green)}
.icon-btn{width:52px;height:52px;border-radius:26px;border:none;background:var(--red-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.part{flex:1 1 120px;background:var(--bg);border-radius:14px;padding:10px 12px}
.part b{display:block;font-size:16px}
.part span{font-size:13px;color:var(--muted)}
.tip{margin:0;font-size:14px;line-height:20px;color:var(--ink2)}
.list{background:#fff;border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;border-bottom:1px solid var(--bg);background:#fff;width:100%;text-align:left}
.li:last-child{border-bottom:none}
.li .t{font-size:17px;font-weight:600}
.li .s{font-size:14px;color:var(--muted)}
.chev{flex-shrink:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.1);padding:8px 0 calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);min-height:44px}
.tab[aria-current="page"]{color:var(--red-text)}
.ring{flex-shrink:0}
.seg{background:#E3E3E8;border-radius:10px;padding:2px;display:grid;gap:0}
.seg button{height:34px;border:none;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button[aria-selected="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;color:var(--ink)}
.search{height:44px;border-radius:12px;background:#E3E3E8;display:flex;align-items:center;gap:8px;padding:0 12px}
.search input{flex:1;border:none;background:transparent;font-size:17px;outline:none;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:16px;border:none;background:#fff;font-size:14px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}
.sheet-inner{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 40px) 20px;min-height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.close{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;margin-left:-12px}
.back{border:none;background:none;color:var(--red-text);font-size:17px;display:flex;align-items:center;gap:2px;min-height:44px;margin-left:-8px;padding:0}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>div{height:8px;background:var(--red);border-radius:4px;transition:width .3s}
.opt{min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:600;text-align:left;padding:12px 18px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt.right{border:2px solid var(--green);background:var(--green-soft);color:var(--green-text)}
.opt.wrong{border:2px solid var(--red-text);background:var(--red-soft);color:var(--red-dark)}
.opt.dim{color:#8E8E93;font-weight:500}
.table{background:#fff;border-radius:20px;overflow:hidden}
.tr{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--bg)}
.tr.head{background:#FAFAFC;padding:9px 16px;border-bottom:1px solid var(--line)}
.tr.head span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.unit{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:20px;border:none;width:100%;text-align:left}
.unit-num{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog>div{height:6px;background:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.flag{width:30px;height:30px;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.flag i{flex:1;display:block}
.rec{display:flex;gap:8px;flex-wrap:wrap}
.rec button{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.rec button.on{background:var(--red);border-color:var(--red);color:#fff}
.rec button.fam{background:var(--amber-soft);border-color:var(--amber-soft);color:var(--amber)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

    main = '<div class="card stack gap10" style="text-align:center;padding:28px"><p class="big">Alles geschafft!</p><p class="muted" style="margin:0">Alle '+S.length+' Sätze sind abgehakt. Neue Einheiten folgen.</p></div>';
  }
  var nextUnit = cur ? cur.u : null;
  var more = '<div class="stack gap6"><p class="over" style="margin-left:4px">Außerdem</p><div class="list">'+
    (nextUnit?'<button class="li" data-lesson="'+nextUnit+'"><span class="unit-num" style="width:32px;height:32px;border-radius:9px;background:var(--red)">'+I.play+'</span><span class="stack" style="flex:1"><span class="t" style="font-size:16px">Lektion · 5 Min</span><span class="s">'+esc(unitTitle(nextUnit))+'</span></span>'+I.chev+'</button>':'')+

    '</div></div>';
  return '<div class="stack gap14">'+head+status+main+more+'</div>';
}

function viewLernen(){
  var units = UNITS.map(function(u, i){
    var list = S.filter(function(s){ return s.u===u.id; });
    var d = list.filter(function(s){ return isDone(s.id); }).length;

    return '<button class="unit" data-lesson="'+u.id+'"><span class="unit-num" style="'+bg+'">'+(full?I.check('#fff'):(i+1))+'</span>'+
      '<span class="stack" style="flex:1;min-width:0"><span style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red-text)">Einheit '+(i+1)+'</span>'+
      '<span style="font-size:18px;font-weight:700">'+esc(u.title)+'</span><span style="font-size:14px;color:var(--muted)">'+esc(u.sub)+' · '+d+'/'+list.length+'</span>'+
      '<span class="prog"><span style="display:block;height:6px;width:'+Math.round(d/list.length*100)+'%;background:var(--red)"></span></span></span>'+I.chev+'</button>';
  }).join('');
  return '<div class="stack gap14"><div class="stack" style="gap:2px"><p class="over">'+doneCount()+' von '+S.length+' Sätzen</p><h1>Lernpfad</h1></div>'+units+
    '<p class="tip muted" style="text-align:center;margin-top:6px">Jede Lektion: neue Sätze ansehen, anhören, dann ein kurzes Quiz.</p></div>';

function allEntries(){
  var e = [];
  VERBS.forEach(function(v, i){ e.push({pl:v.pl, de:v.de, say:v.say, k:'Verb', verb:i}); });
  S.forEach(function(s){ e.push({pl:s.pl, de:s.de, say:s.say, k: s.sl?'Schlesisch':(/[.!?…]$/.test(s.pl)?'Satz':'Nomen'), sid:s.id}); });
  WORDS.forEach(function(w){ e.push(w); });
  return e;
}
function viewWoerter(){

  return '<div class="stack gap14"><h1>Wörterbuch</h1>'+
    '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Suchen</span>'+
    '<input id="q" type="search" placeholder="Deutsch oder Polnisch suchen" value="'+esc(ui.q)+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></label>'+
    '<div class="chips" role="group" aria-label="Filter">'+chips+'</div>'+
    '<div id="wres" class="stack gap10">'+woerterResults()+'</div></div>';
}
function woerterResults(){
  var q = ui.q.toLowerCase().trim();
  var res = allEntries().filter(function(x){
    var hit = !q || x.pl.toLowerCase().indexOf(q)>=0 || x.de.toLowerCase().indexOf(q)>=0;
    var f = ui.filter;
    var ok = f==='Alle' || (f==='Verben'&&x.k==='Verb') || (f==='Sätze'&&x.k==='Satz') || (f==='Schlesisch'&&x.k==='Schlesisch');
    return hit && ok;
  });
  var rows = res.map(function(x, i){
    var attr = x.verb!==undefined ? 'data-verb="'+x.verb+'"' : 'data-word="'+esc(x.pl)+'"';
    var pc = x.k==='Verb' ? 'background:var(--red-soft);color:var(--red-text)' : (x.k==='Schlesisch'?'background:var(--amber-soft);color:var(--amber)':'');
    return '<button class="li" '+attr+'><span class="stack" style="flex:1;min-width:0"><span class="t" lang="pl">'+esc(x.pl)+'</span><span class="s">'+esc(x.de)+'</span></span><span class="pill" style="'+pc+'">'+esc(x.k)+'</span>'+I.chev+'</button>';
  }).join('');
  return '<p class="over" style="margin:4px 0 0 4px">'+res.length+' Treffer</p>'+
    (res.length?'<div class="list">'+rows+'</div>':'<div class="card stack gap6"><b>Noch nicht im Wörterbuch</b><span class="muted" style="font-size:14px">Frag deinen Freund danach, ich ergänze es dann.</span></div>');
}

  '</div>';

/* ---------- Sheets ---------- */
function sheetWrap(inner){ return '<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-inner">'+inner+'</div></div>'; }

function viewWord(pl){
  var x = allEntries().filter(function(e){ return e.pl===pl; })[0]; if (!x) return '';
  var s = x.sid ? S.filter(function(t){ return t.id===x.sid; })[0] : null;
  var body = s ? sentenceCard(s, x.k) :
    '<div class="card stack gap14"><div class="row between"><p class="eyebrow">'+esc(x.k)+'</p></div>'+
    '<div class="row between" style="gap:12px"><div class="stack gap6"><p class="big" lang="pl">'+esc(x.pl)+'</p><p class="say">Sprich: '+sayHTML(x.say)+'</p></div><button class="icon-btn" data-speak="'+esc(x.pl)+'" aria-label="Anhören">'+I.speaker+'</button></div>'+
    '<p class="de">'+esc(x.de)+'</p>'+(x.k==='Schlesisch'?'<span class="pill sl" style="align-self:flex-start">Familien-Check: Aussprache bestätigen lassen</span>':'')+recBlock(x.pl)+'</div>';
  return sheetWrap('<div class="topbar"><button class="back" data-close>'+I.back+'Zurück</button></div><div class="stack gap14" style="margin-top:8px">'+body+
    '<button class="btn outline" data-speak-slow="'+esc(x.pl)+'">Langsam anhören</button></div>');
}

function viewVerb(i){
  var v = VERBS[i]; var t = ui.tense;
  var forms = t==='pr' ? v.pr : (t==='pa' ? v.pa : FUT.map(function(f){ return v.noInfFut ? f : [f[0]+' '+v.pl, f[1]+' '+v.say]; }));
  var note = t==='pr' ? 'Das Wort für „ich“, „du“ usw. lässt man meist weg: „'+v.pr[0][0]+'“ reicht schon. Höflich (Sie) zu einer Frau: „Pani '+v.pr[2][0]+'“, zu einem Mann: „Pan '+v.pr[2][0]+'“.' :
    (t==='pa' ? 'Vergangenheit hängt vom Geschlecht ab. Hier stehen bei „ich“ und „du“ die weiblichen Formen (deine). Ein Mann sagt z. B. „'+v.pa[0][0].replace(/am$/,'em').replace(/łam$/,'łem')+'“.' :
    (v.noInfFut ? 'Bei „być“ ist die Zukunft einfach: będę = ich werde sein.' : 'Zukunft = będę (ich werde) + Grundform, ganz wie im Deutschen.'));
  var rows = forms.map(function(f, k){
    return '<button class="tr" data-speak="'+esc(f[0].split(' / ')[0])+'" style="width:100%;border:none;background:#fff;text-align:left">'+
      '<span class="stack"><span style="font-size:15px;font-weight:600;color:var(--ink2)">'+esc(PERS[k][0])+'</span><span style="font-size:12px;color:var(--muted)" lang="pl">'+esc(PERS[k][1])+'</span></span>'+
      '<span style="font-size:18px;font-weight:700" lang="pl">'+esc(f[0])+'</span><span style="font-size:13px;color:var(--muted);text-align:right">'+sayHTML(f[1])+'</span></button>';
  }).join('');
  var seg = [['pr','Gegenwart'],['pa','Vergangenheit'],['fu','Zukunft']].map(function(s){ return '<button role="tab" data-tense="'+s[0]+'" aria-selected="'+(t===s[0])+'">'+s[1]+'</button>'; }).join('');
  return sheetWrap('<div class="topbar"><button class="back" data-close>'+I.back+'Zurück</button><span style="flex:1"></span><button class="icon-btn" style="width:44px;height:44px" data-speak="'+esc(v.pl)+'" aria-label="Anhören">'+I.speaker+'</button></div>'+
    '<div class="stack gap14" style="margin-top:4px"><div class="stack" style="gap:2px"><p class="muted" style="margin:0;font-size:13px;font-weight:600">Verb</p>'+
    '<div class="row" style="gap:12px;align-items:baseline;flex-wrap:wrap"><h1 lang="pl">'+esc(v.pl)+'</h1><span class="say">Sprich: '+sayHTML(v.say)+'</span></div><p class="de" style="color:var(--ink2)">'+esc(v.de)+'</p></div>'+
    '<div class="seg" role="tablist" aria-label="Zeitform" style="grid-template-columns:repeat(3,1fr)">'+seg+'</div>'+
    '<div class="table"><div class="tr head"><span>Person</span><span>Polnisch</span><span style="color:var(--red-text)">Sprich</span></div>'+rows+
    '<div style="padding:10px 16px;background:#FAFAFC;font-size:13px;line-height:18px;color:var(--ink2)">'+esc(note)+' Tippe eine Zeile an, um sie zu hören.</div></div>'+
    '<div class="card stack" style="gap:4px;padding:14px 16px"><span class="over" style="font-size:12px">Beispiel</span><span style="font-size:17px;font-weight:600" lang="pl">'+esc(v.ex[0])+'</span><span class="muted" style="font-size:14px">'+esc(v.ex[1])+'</span></div></div>');
}

/* Lektion */
var L = null;
function startLesson(unitId){
  var all = S.filter(function(s){ return s.u===unitId; });
  var fresh = all.filter(function(s){ return !isDone(s.id); }).slice(0,3);
  var review = fresh.length===0;
  var set = review ? shuffle(all).slice(0,4) : fresh;
  var steps = [];
  if (!review) set.forEach(function(s){ steps.push({type:'card', s:s}); });
  set.forEach(function(s){ steps.push({type:'quiz', s:s, opts: shuffle([s].concat(shuffle(S.filter(function(o){ return o.id!==s.id; })).slice(0,3)))}); });
  steps.push({type:'done'});
  L = {unit:unitId, steps:steps, i:0, picked:null, set:set, review:review, right:0};
  ui.sheet = {kind:'lesson'}; render();
}
function viewLesson(){
  var step = L.steps[L.i]; var total = L.steps.length;
  var top = '<div class="topbar"><button class="close" data-close aria-label="Lektion schließen">'+I.x+'</button><div class="bar"><div style="width:'+Math.round((L.i+1)/total*100)+'%"></div></div><span style="font-size:15px;font-weight:600;color:var(--muted);min-width:42px;text-align:right">'+Math.min(L.i+1,total)+'/'+total+'</span></div>';
  var body = '', cta = '';
  if (step.type==='card'){
    body = '<p class="muted" style="margin:18px 0 12px;font-size:15px">'+esc(unitTitle(L.unit))+'</p>'+sentenceCard(step.s,'Neuer Satz');
    cta = '<button class="btn" data-next>Weiter</button>';
  } else if (step.type==='quiz'){
    var opts = step.opts.map(function(o){
      var cls = 'opt', icon = '';
      if (L.picked){
        if (o.id===step.s.id){ cls+=' right'; icon=I.check('#248A3D'); }
        else if (o.id===L.picked){ cls+=' wrong'; icon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'; }
        else cls+=' dim';
      }
      return '<button class="'+cls+'" data-pick="'+o.id+'"'+(L.picked?' disabled':'')+'><span>'+esc(o.de)+'</span>'+icon+'</button>';
    }).join('');
    body = '<div class="stack gap6" style="margin-top:24px"><p class="eyebrow">Was bedeutet das?</p></div>'+
      '<div class="card stack gap10" style="margin-top:14px;align-items:center;text-align:center"><button class="icon-btn" style="width:72px;height:72px;border-radius:36px" data-speak="'+esc(step.s.pl)+'" aria-label="Anhören">'+I.speaker+'</button>'+
      '<p class="big" lang="pl" style="font-size:26px">'+esc(step.s.pl)+'</p><p class="say">Sprich: '+sayHTML(step.s.say)+'</p></div>'+
      '<div class="stack gap10" style="margin-top:18px">'+opts+'</div>';
    cta = L.picked ? '<button class="btn'+(L.picked===step.s.id?' green':'')+'" data-next>'+(L.picked===step.s.id?'Richtig! Weiter':'Weiter')+'</button>' : '<p class="muted" style="text-align:center;margin:0;height:54px;line-height:54px">Tippe auf die richtige Bedeutung</p>';
  } else {
    var n = L.set.length;
    body = '<div class="stack gap14" style="align-items:center;text-align:center;margin-top:48px"><span style="width:96px;height:96px;border-radius:48px;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px var(--red-soft)"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>'+
      '<h1 style="margin-top:16px;font-size:30px">'+(L.review?'Wiederholung geschafft!':'Lektion geschafft!')+'</h1><p class="muted" style="margin:0">'+L.right+' von '+n+' richtig'+(L.review?'':' · '+n+' neue Sätze')+'</p></div>';
    cta = '<button class="btn" data-finish>Fertig</button>';
  }
  return sheetWrap(top+'<div class="stack" style="flex:1">'+body+'</div><div style="margin-top:24px">'+cta+'</div>');
}

/* ---------- Rendern ---------- */
function render(){
  var content = ui.tab==='heute'?viewHeute():ui.tab==='lernen'?viewLernen():ui.tab==='woerter'?viewWoerter():viewMehr();
  var tabs = [['heute','Heute','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],
    ['lernen','Lernpfad','<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>'],
    ['woerter','Wörterbuch','<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'],
    ['mehr','Mehr','<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>']].map(function(t){
      return '<button class="tab" data-go="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>';
    }).join('');
  var sheet = '';
  if (ui.sheet){
    if (ui.sheet.kind==='word') sheet = viewWord(ui.sheet.pl);
    else if (ui.sheet.kind==='verb') sheet = viewVerb(ui.sheet.i);
    else if (ui.sheet.kind==='lesson' && L) sheet = viewLesson();
  }
  root.innerHTML = '<main class="app">'+content+'</main><nav class="tabbar" aria-label="Hauptnavigation">'+tabs+'</nav>'+sheet;
  document.body.style.overflow = ui.sheet ? 'hidden' : '';
}

function go(tab){
  ui.tab = tab; ui.sheet = null;
  try { if (location.hash !== '#'+tab) history.replaceState(null,'','#'+tab); } catch(e) {}
  render(); window.scrollTo(0,0);
}

/* ---------- Events ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('button, [data-go]'); if (!el) return;
  var d = el.dataset;
  if (d.go){ go(d.go); return; }
  if (d.voice){ st.voiceMode = d.voice; st.ttsBroken = false; save(); render(); return; }
  if (d.rec){ startRec(d.rec); return; }
  if (el.hasAttribute('data-recstop')){ stopRec(); return; }
  if (d.recplay){ playRec(d.recplay, false); return; }
  if (d.recdel){ deleteRec(d.recdel); return; }
  if (d.speak){ speak(d.speak, false); return; }
  if (d.speakSlow){ speak(d.speakSlow, true); return; }
  if (d.learn){ st.learned[d.learn] = true; touchStreak(); save(); toast('Abgehakt ✓ Weiter geht’s mit dem nächsten Satz'); render(); return; }
  if (d.known){ st.known[d.known] = true; save(); toast('Als „Kann ich schon“ markiert'); render(); return; }
  if (d.unknow){ delete st.known[d.unknow]; delete st.learned[d.unknow]; save(); render(); return; }
  if (d.lesson){ startLesson(d.lesson); return; }
  if (d.filter){ ui.filter = d.filter; render(); return; }
  if (d.verb !== undefined){ ui.tense = 'pr'; ui.sheet = {kind:'verb', i:+d.verb}; render(); return; }
  if (d.word){ ui.sheet = {kind:'word', pl:d.word}; render(); return; }
  if (d.tense){ ui.tense = d.tense; render(); return; }
  if (el.hasAttribute('data-close')){ ui.sheet = null; L = null; render(); return; }
  if (d.pick && L){ L.picked = d.pick; var st2 = L.steps[L.i]; if (d.pick===st2.s.id) L.right++; render(); speak(st2.s.pl,false); return; }
  if (el.hasAttribute('data-next') && L){ L.i++; L.picked = null; render(); return; }
  if (el.hasAttribute('data-finish') && L){ if (!L.review) L.set.forEach(function(s){ st.learned[s.id] = true; }); touchStreak(); save(); L = null; ui.sheet = null; render(); return; }
  if (el.id==='reset'){ ui.sheet = {kind:'confirm'}; renderConfirm(); return; }
});
function renderConfirm(){
  render();
  var box = document.createElement('div');
  box.innerHTML = sheetWrap('<div class="stack gap14" style="margin:auto 0"><div class="card stack gap14"><b style="font-size:19px">Fortschritt wirklich zurücksetzen?</b><p class="tip muted" style="margin:0">Alle Haken und „Kann ich schon“-Markierungen werden gelöscht.</p><button class="btn" id="doReset">Ja, zurücksetzen</button><button class="btn ghost" id="noReset">Abbrechen</button></div></div>');
  document.body.appendChild(box);
  box.querySelector('#doReset').onclick = function(){ st.learned = {}; st.known = {}; st.streak = 0; st.lastDay=''; save(); box.remove(); ui.sheet=null; render(); toast('Zurückgesetzt'); };
  box.querySelector('#noReset').onclick = function(){ box.remove(); ui.sheet=null; render(); };
}
document.addEventListener('input', function(ev){
  if (ev.target.id==='q'){
    ui.q = ev.target.value;
    var box = document.getElementById('wres'); if (box) box.innerHTML = woerterResults();
  }
